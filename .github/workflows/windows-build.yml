name: Windows build and regression checks
on:
  push:
    branches: [main, update/moku-2.13.3]
  workflow_dispatch:
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Run platform-independent regression checks
        run: dotnet run --project Island.Tests/Island.Tests.csproj -c Release
      - name: Publish Windows app (requires .NET 8 Desktop Runtime)
        run: dotnet publish Island/Island.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o Island/publish
      - name: Exercise window restoration and WPF popup styles
        timeout-minutes: 3
        run: dotnet run --project Island.Windows.Tests/Island.Windows.Tests.csproj -c Release
      - name: Compile WPF installer with application payload
        run: dotnet build Installer/Installer.csproj -c Release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Moku-system-ui-preview
          path: ui-preview/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: Moku-2.13.3-framework-dependent-win-x64
          path: Island/publish/
          retention-days: 14
      - name: Build self-contained release installer
        run: |
          dotnet publish Island/Island.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:InvariantGlobalization=false -p:DebugType=None -p:DebugSymbols=false -o Island/publish
          dotnet publish Installer/Installer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o Installer/publish
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item Installer/publish/Moku-Setup.exe release/Moku-Setup-2.13.3-x64.exe
          if ((Get-Item release/Moku-Setup-2.13.3-x64.exe).Length -lt 50MB) { throw "installer looks incomplete" }
      - uses: actions/upload-artifact@v4
        with:
          name: Moku-Setup-2.13.3-x64
          path: release/Moku-Setup-2.13.3-x64.exe
          retention-days: 14
          compression-level: 0
